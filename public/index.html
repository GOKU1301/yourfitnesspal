<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Image Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .upload-container {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
            margin-top: 20px;
        }
        .file-input {
            display: none;
        }
        .file-label {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }
        .file-label:hover {
            background-color: #45a049;
        }
        .preview-container {
            margin: 20px 0;
        }
        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border: 1px solid #ddd;
        }
        .upload-button {
            background-color: #2196F3;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .upload-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
    </style>
</head>
<body>
    <h1>Upload Timetable Image</h1>
    <p>Select an image to upload. It will be saved as timetable.jpg</p>
    
    <div class="upload-container">
        <form id="uploadForm">
            <div>
                <input type="file" id="timetableUpload" class="file-input" accept="image/*">
                <label for="timetableUpload" class="file-label" id="fileLabel">Choose Image</label>
                <div id="fileInfo"></div>
            </div>
            
            <div class="preview-container" id="previewContainer" style="display: none;">
                <h3>Preview:</h3>
                <img id="imagePreview" class="preview-image" alt="Timetable preview">
            </div>
            
            <button type="submit" class="upload-button" id="uploadButton" disabled>Upload Image</button>
            <div id="message"></div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('timetableUpload');
            const fileLabel = document.getElementById('fileLabel');
            const fileInfo = document.getElementById('fileInfo');
            const previewContainer = document.getElementById('previewContainer');
            const imagePreview = document.getElementById('imagePreview');
            const uploadButton = document.getElementById('uploadButton');
            const messageDiv = document.getElementById('message');
            const form = document.getElementById('uploadForm');
            
            // Handle file selection
            fileInput.addEventListener('change', function(e) {
                if (fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    
                    // Update file info
                    fileInfo.innerHTML = `
                        <div>File: ${file.name}</div>
                        <div>Size: ${(file.size / 1024).toFixed(2)} KB</div>
                    `;
                    
                    // Show preview
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imagePreview.src = e.target.result;
                        previewContainer.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                    
                    // Enable upload button
                    uploadButton.disabled = false;
                    messageDiv.textContent = '';
                }
            });
            
            // Handle form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                if (!fileInput.files || !fileInput.files[0]) {
                    showMessage('Please select a file first!', 'error');
                    return;
                }
                
                const formData = new FormData();
                formData.append('timetable', fileInput.files[0]);
                
                try {
                    showMessage('Uploading image...', 'info');
                    uploadButton.disabled = true;
                    fileInput.disabled = true;
                    
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.text();
                    
                    if (response.ok) {
                        showMessage('Image uploaded and saved as timetable.jpg', 'success');
                        console.log('Server response:', result);
                    } else {
                        throw new Error(result || 'Failed to upload image');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showMessage(error.message || 'An error occurred. Please try again.', 'error');
                } finally {
                    uploadButton.disabled = false;
                    fileInput.disabled = false;
                }
            });
            
            function showMessage(message, type) {
                messageDiv.textContent = message;
                messageDiv.className = '';
                if (type) {
                    messageDiv.classList.add(type);
                }
            }
        });
    </script>
</body>
</html>
